<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://upload.uploadcare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fotos · Ana & Nuno · 19.09.2026</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root { --gold:#cdb07a; --gold-pale:rgba(205,176,122,.2); --dark:#221c0f; --mid:#5a5040; --cream:#fdf8f0; --muted:#a09060; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--cream); font-family:'Jost',sans-serif; font-weight:300; color:var(--dark); min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:3rem 1.5rem; text-align:center; }
  body::before { content:''; position:fixed; inset:0; background-image:radial-gradient(ellipse at 10% 20%,rgba(205,176,122,.07) 0%,transparent 60%),radial-gradient(ellipse at 90% 80%,rgba(205,176,122,.07) 0%,transparent 60%); pointer-events:none; }
  .wrap { position:relative; z-index:1; max-width:440px; width:100%; }
  .monogram { font-family:'Cormorant Garamond',serif; font-size:1rem; color:var(--gold); letter-spacing:.35em; margin-bottom:1.4rem; }
  h1 { font-family:'Cormorant Garamond',serif; font-size:2.8rem; font-weight:300; line-height:1.15; margin-bottom:.3rem; }
  h1 em { font-style:italic; color:#7a6020; }
  .rule { width:50px; height:.5px; background:var(--gold); opacity:.5; margin:1.3rem auto; }
  .subtitle { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:1.1rem; color:var(--mid); line-height:1.75; margin-bottom:2.5rem; }
  .card { background:white; border:1px solid var(--gold-pale); border-radius:8px; padding:2.5rem 2rem; box-shadow:0 6px 30px rgba(34,28,15,.07); }
  .name-wrap { margin-bottom:1.5rem; text-align:left; }
  .name-wrap label { display:block; font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin-bottom:.45rem; }
  .name-wrap input[type=text] { width:100%; padding:.7rem 1rem; border:1px solid var(--gold-pale); border-radius:4px; background:var(--cream); font-family:'Jost',sans-serif; font-size:14px; color:var(--dark); outline:none; transition:border-color .2s; }
  .name-wrap input[type=text]:focus { border-color:var(--gold); }
  .name-wrap input[type=text]::placeholder { color:var(--muted); }
  .drop-zone { border:1.5px dashed var(--gold); border-radius:6px; padding:2rem 1rem; cursor:pointer; transition:background .2s; position:relative; margin-bottom:1rem; }
  .drop-zone:hover, .drop-zone.drag { background:rgba(205,176,122,.08); }
  .drop-zone input[type=file] { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
  .drop-icon { font-size:2rem; margin-bottom:.5rem; }
  .drop-label { font-family:'Cormorant Garamond',serif; font-size:1.05rem; color:var(--dark); display:block; margin-bottom:.2rem; }
  .drop-hint { font-size:11px; color:var(--muted); }
  .preview-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:.8rem 0; }
  .preview-grid img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:3px; }
  .count { font-size:12px; color:var(--gold); font-family:'Cormorant Garamond',serif; font-style:italic; margin-bottom:1rem; }
  .btn { display:block; width:100%; padding:1rem; background:var(--dark); color:var(--cream); font-family:'Jost',sans-serif; font-size:12px; letter-spacing:.18em; text-transform:uppercase; border:none; border-radius:4px; cursor:pointer; transition:background .2s; margin-top:.5rem; }
  .btn:hover { background:#3a3020; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .progress-wrap { width:100%; height:2px; background:var(--gold-pale); border-radius:1px; margin:1rem 0; display:none; overflow:hidden; }
  .progress-bar { height:100%; background:var(--gold); border-radius:1px; width:0%; transition:width .3s; }
  .status { font-size:12px; color:var(--muted); min-height:18px; margin-top:.4rem; }
  .success { display:none; padding:1rem 0; }
  .success .big { font-size:3rem; margin-bottom:1rem; }
  .success p { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:1.15rem; color:var(--mid); line-height:1.7; margin-bottom:1.5rem; }
  .btn-more { padding:.65rem 1.8rem; border:1px solid var(--gold); background:transparent; color:var(--dark); font-family:'Jost',sans-serif; font-size:11px; letter-spacing:.15em; text-transform:uppercase; border-radius:4px; cursor:pointer; }
  .date-line { font-size:9px; letter-spacing:.22em; text-transform:uppercase; color:var(--gold); margin-top:2rem; }
  @media (prefers-color-scheme:dark) {
    :root:not([data-theme="light"]) { --cream:#1a1608; --dark:#f0e8d5; --mid:#c0a870; }
    .card { background:#2a2418; }
    .name-wrap input[type=text] { background:#1a1608; }
  }
</style>
</head>
<body>
<div class="wrap">
  <p class="monogram">A ✦ N</p>
  <h1>As vossas<br><em>Memórias</em></h1>
  <div class="rule"></div>
  <p class="subtitle">Partilhem os momentos que capturaram hoje —<br>cada foto é um presente para nós.</p>

  <div class="card">
    <div id="formSection">
      <div class="name-wrap">
        <label>O vosso nome</label>
        <input type="text" id="nameInput" placeholder="opcional">
      </div>

      <div class="drop-zone" id="dropZone">
        <input type="file" id="fileInput" accept="image/*,video/*" multiple>
        <div class="drop-icon">📷</div>
        <span class="drop-label">Toque para selecionar</span>
        <span class="drop-hint">fotos e vídeos da galeria ou câmara</span>
      </div>

      <div class="preview-grid" id="previewGrid"></div>
      <div class="count" id="count"></div>

      <button class="btn" id="sendBtn" disabled onclick="sendFiles()">Enviar fotos</button>

      <div class="progress-wrap" id="progressWrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="status" id="status"></div>
    </div>

    <div class="success" id="successSection">
      <div class="big">🥂</div>
      <p>Obrigado por partilharem<br>este momento connosco!</p>
      <button class="btn-more" onclick="reset()">Enviar mais fotos</button>
    </div>
  </div>

  <p class="date-line">Ana & Nuno · 19 de Setembro de 2026 · Herdade dos Grous</p>
</div>

<script>
const PUB_KEY = 'ad5e9b8eeef751608b0e';
let files = [];

const fileInput = document.getElementById('fileInput');
const dropZone = document.getElementById('dropZone');

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('drag'); setFiles(Array.from(e.dataTransfer.files)); });
fileInput.addEventListener('change', () => setFiles(Array.from(fileInput.files)));

function setFiles(f) {
  files = f;
  const grid = document.getElementById('previewGrid');
  const count = document.getElementById('count');
  grid.innerHTML = '';
  f.slice(0,9).forEach(file => {
    if (file.type.startsWith('image/')) {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      grid.appendChild(img);
    }
  });
  count.textContent = f.length ? `${f.length} ficheiro${f.length>1?'s':''} selecionado${f.length>1?'s':''}` : '';
  document.getElementById('sendBtn').disabled = f.length === 0;
}

async function uploadFile(file, name, idx) {
  const fd = new FormData();
  fd.append('UPLOADCARE_PUB_KEY', PUB_KEY);
  fd.append('UPLOADCARE_STORE', '1');
  const safe = (name||'Convidado').replace(/[^\w\sÀ-ú]/g,'').trim();
  const ext = file.name.split('.').pop();
  fd.append('file', file, `${safe}_${Date.now()}_${idx}.${ext}`);
  const r = await fetch('https://upload.uploadcare.com/base/', { method:'POST', body:fd });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function sendFiles() {
  if (!files.length) return;
  const name = document.getElementById('nameInput').value.trim();
  const sendBtn = document.getElementById('sendBtn');
  const progressWrap = document.getElementById('progressWrap');
  const progressBar = document.getElementById('progressBar');
  const status = document.getElementById('status');

  sendBtn.disabled = true;
  progressWrap.style.display = 'block';

  let ok = 0, fail = 0;
  for (let i = 0; i < files.length; i++) {
    try {
      status.textContent = `A enviar ${i+1} de ${files.length}…`;
      progressBar.style.width = `${(i/files.length)*100}%`;
      await uploadFile(files[i], name, i+1);
      ok++;
    } catch(e) {
      console.error(e);
      fail++;
    }
  }
  progressBar.style.width = '100%';

  if (fail === 0) {
    setTimeout(() => {
      document.getElementById('formSection').style.display = 'none';
      document.getElementById('successSection').style.display = 'block';
    }, 500);
  } else {
    status.textContent = `${ok} enviada(s), ${fail} com erro. Tente novamente.`;
    sendBtn.disabled = false;
  }
}

function reset() {
  files = [];
  fileInput.value = '';
  document.getElementById('previewGrid').innerHTML = '';
  document.getElementById('count').textContent = '';
  document.getElementById('nameInput').value = '';
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('status').textContent = '';
  document.getElementById('formSection').style.display = 'block';
  document.getElementById('successSection').style.display = 'none';
}
</script>
</body>
</html>
